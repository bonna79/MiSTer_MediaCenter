# Attaches the PDF documentation in docs/ to an existing release.
# Run by hand (Actions -> Attach documentation to release -> Run workflow).
# It does not build anything and does not touch MiSTer_MediaCenter.zip or the release notes.
name: Attach documentation to release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v4.5'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload the PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            docs/MMC_4.5_documentazione_completa_IT.pdf
            docs/MMC_4.5_documentation_complete_EN.pdf
