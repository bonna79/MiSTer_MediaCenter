name: Build MediaCenter menu core

on:
  workflow_dispatch:
  push:
    paths:
      - 'fpga/**'
      - '.github/workflows/fpga.yml'

jobs:
  menu_core:
    runs-on: ubuntu-22.04
    container: theypsilon/quartus-lite-c5:17.0.2
    steps:
      - uses: actions/checkout@v4

      - name: Compile with Quartus
        working-directory: fpga/menu
        run: |
          quartus_sh --flow compile menu.qpf
          grep -A4 "Fitter Resource Usage Summary" output_files/menu.fit.summary || cat output_files/menu.fit.summary
          cp output_files/menu.rbf ../../menu_mediacenter.rbf

      - uses: actions/upload-artifact@v4
        with:
          name: menu_mediacenter
          path: menu_mediacenter.rbf
