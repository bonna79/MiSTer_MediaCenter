name: Build MiSTer MediaCenter

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain (same as .devcontainer/Dockerfile)
        run: |
          wget -qO- "https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf.tar.xz?revision=d0b90559-3960-4e4b-9297-7ddbc3e52783&rev=d0b9055939604e4b92977ddbc3e52783&hash=0074C1529DE90C98726B80ED3EE0776C" | tar -xJ -C /opt
          echo "$(echo /opt/gcc-arm-*/bin)" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make
          cp bin/MiSTer bin/MiSTer_MediaCenter

      - uses: actions/upload-artifact@v4
        with:
          name: MiSTer_MediaCenter
          path: bin/MiSTer_MediaCenter

      - name: Build Video CD player
        run: make vcd_player

      - uses: actions/upload-artifact@v4
        with:
          name: vcd_player
          path: |
            bin/vcd_player
            bin/vcd_player.elf

      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ffmpeg-arm
          key: ffmpeg-n6.1.2-${{ hashFiles('tools/mediacenter/build_ffmpeg.sh', 'tools/mediacenter/ffmpeg-*.patch') }}

      - name: Build FFmpeg for the MiSTer ARM
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b n6.1.2 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          tools/mediacenter/build_ffmpeg.sh ffmpeg-src "$PWD/ffmpeg-arm"

      - uses: actions/cache@v4
        id: dvdnav-cache
        with:
          path: dvdnav-arm
          key: dvdnav-6.1.1-dvdread-6.1.3-${{ hashFiles('tools/mediacenter/build_dvdnav.sh') }}

      - name: Build libdvdread and libdvdnav for the MiSTer ARM
        if: steps.dvdnav-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://download.videolan.org/pub/videolan/libdvdread/6.1.3/libdvdread-6.1.3.tar.bz2 | tar -xj
          curl -fsSL https://download.videolan.org/pub/videolan/libdvdnav/6.1.1/libdvdnav-6.1.1.tar.bz2 | tar -xj
          tools/mediacenter/build_dvdnav.sh libdvdread-6.1.3 libdvdnav-6.1.1 "$PWD/dvdnav-arm"

      - name: Build MediaCenter player
        run: make mediacenter FFMPEG="$PWD/ffmpeg-arm" DVDNAV="$PWD/dvdnav-arm" MC_BUILD="${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mediacenter_arm
          path: |
            bin/mediacenter
            dvdcss/libdvdcss.so.2
            Scripts/mediacenter.sh

      # The menu core is compiled by fpga.yml (Quartus, only when fpga/ changes):
      # the release takes its latest successful build.
      - name: Fetch the menu core
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: fpga.yml
          branch: main
          workflow_conclusion: success
          name: mediacenter_rbf
          path: rbf

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        run: |
          mkdir -p pkg/linux pkg/Scripts
          cp rbf/menu_mediacenter.rbf pkg/linux/
          mkdir -p pkg/dvdcss
          # libdvdcss for protected DVDs, kept in the repository (dvdcss/)
          cp dvdcss/libdvdcss.so.2 pkg/dvdcss/
          cp bin/MiSTer_MediaCenter pkg/
          cp bin/mediacenter pkg/linux/
          cp Scripts/mediacenter.sh pkg/Scripts/
          cp LICENSE pkg/linux/mediacenter-LICENSE
          # the MiSTer.ini lines to copy (not a MiSTer.ini: it would replace the user's)
          cp docs/MMC_MiSTer_ini.txt pkg/
          (cd pkg && zip -r ../MiSTer_MediaCenter.zip .)
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MiSTer MediaCenter ${{ env.VERSION }}
          files: MiSTer_MediaCenter.zip
          body_path: RELEASE_NOTES.md
